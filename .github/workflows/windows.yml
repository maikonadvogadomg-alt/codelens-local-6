# Gera o CodeLens PRONTO para Windows: um .zip com tudo dentro (inclusive o
# Node), que abre com dois cliques sem instalar nada.
# Diferente da receita da Replit: é montado NO WINDOWS, o app montado é
# TESTADO antes, e se algo falhar a execução fica VERMELHA (nada de "verde
# enganando"). No fim, o arquivo fica em "Releases" para baixar.
name: Gerar app para Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar as peças
        run: npm install --no-audit --no-fund

      - name: Montar a tela
        run: npm run build

      - name: Tirar o que só servia para montar
        run: npm prune --omit=dev

      - name: Montar a pasta do app
        shell: pwsh
        run: |
          $out = "CodeLens"
          New-Item -ItemType Directory $out | Out-Null
          foreach ($i in "dist","server","lib","public","node_modules","scripts","package.json","tsconfig.json","LEIA-ME.md") {
            Copy-Item $i -Destination $out -Recurse
          }
          New-Item -ItemType Directory "$out/node" | Out-Null
          Copy-Item (Get-Command node).Source "$out/node/node.exe"
          Copy-Item "windows/Abrir-CodeLens.bat" $out

      - name: Testar o app montado (do jeito que vai rodar no seu PC)
        shell: pwsh
        run: |
          cd CodeLens
          $env:NO_BROWSER = "1"
          $p = Start-Process -FilePath "node\node.exe" -ArgumentList "scripts\abrir-pronto.mjs" -PassThru -NoNewWindow -RedirectStandardOutput ..\app.log -RedirectStandardError ..\app.err
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest http://localhost:8080/api/healthz -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          if (-not $ok) { Get-Content ..\app.log, ..\app.err; throw "O servidor não ligou" }
          $html = (Invoke-WebRequest http://localhost:8080/ -UseBasicParsing).Content
          if ($html -notmatch 'id="root"') { throw "A tela não abriu" }
          $proj = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"name":"teste","template":"blank"}' http://localhost:8080/api/projects/blank
          Invoke-RestMethod -Method Put -ContentType "application/json" -Body '{"path":"ola.txt","content":"Ola"}' "http://localhost:8080/api/projects/$($proj.id)/files" | Out-Null
          $f = Invoke-RestMethod "http://localhost:8080/api/projects/$($proj.id)/files?path=ola.txt"
          if ($f.content -ne "Ola") { throw "Não salvou o arquivo" }
          $t = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"command":"node -v"}' "http://localhost:8080/api/projects/$($proj.id)/exec"
          $t | ConvertTo-Json -Depth 4
          taskkill /pid $p.Id /T /F | Out-Null
          Start-Sleep 2
          Remove-Item -Recurse -Force dados -ErrorAction SilentlyContinue
          Write-Host "APP TESTADO ✅"

      - name: Compactar
        shell: pwsh
        run: 7z a -tzip -mx=5 CodeLens-Windows.zip CodeLens | Out-Null

      - name: Guardar o arquivo (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CodeLens-Windows
          path: CodeLens-Windows.zip
          if-no-files-found: error

      - name: Publicar para baixar (Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-${{ github.run_number }}" CodeLens-Windows.zip \
            --title "CodeLens para Windows nº ${{ github.run_number }}" \
            --notes "Baixe o CodeLens-Windows.zip, clique com o botão direito > Extrair tudo, e dê dois cliques em Abrir-CodeLens.bat. Não precisa instalar nada."

      - name: Mostrar o registro do app (se algo falhou)
        if: failure()
        shell: pwsh
        run: Get-Content app.log, app.err -ErrorAction SilentlyContinue
